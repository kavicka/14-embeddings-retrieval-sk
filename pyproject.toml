[project]
name = "14-embeddings-retrieval-sk"
version = "0.1.0"
description = "Embeddings and retrieval on Slovak insurance terms"
requires-python = ">=3.12"
dependencies = [
    "faiss-cpu>=1.15.1",
    "hnswlib>=0.8.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.4",
    "pillow>=13.0.0",
    "pyarrow>=26.0.0",
    "pypdf>=6.21.4",
    "rank-bm25>=0.2.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.17.3",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# short scripts that end right after writing: a with-block per json.dump only adds noise
ignore = ["SIM115"]
